<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #000; overflow: hidden; }
        .slide-container { 
            width: 1280px; 
            min-height: 720px; 
            background: radial-gradient(circle at top right, rgba(112, 0, 255, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(0, 240, 255, 0.1), transparent),
                        #050505;
            color: #fff;
            position: relative;
            display: flex;
            align-items: center;
            padding-left: 100px;
        }
        .grid-overlay {
            position: absolute;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }
        .content { position: relative; z-index: 2; max-width: 800px; }
        .kicker { 
            color: #00f0ff; 
            font-size: 14px; 
            font-weight: 800; 
            letter-spacing: 4px; 
            text-transform: uppercase;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .kicker::before { content: ""; width: 40px; height: 2px; background: #00f0ff; }
        h1 { 
            font-size: 84px; 
            font-weight: 900; 
            line-height: 0.95; 
            text-transform: uppercase;
            margin-bottom: 24px;
            background: linear-gradient(to right, #fff, #00f0ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { 
            font-size: 28px; 
            color: #a0a0a0; 
            margin-bottom: 60px;
            font-weight: 400;
            letter-spacing: -0.5px;
        }
        .footer { 
            display: flex; 
            gap: 40px; 
            font-size: 14px; 
            color: #666; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        .footer span { display: flex; align-items: center; gap: 8px; }
        .footer i { color: #7000ff; }
        .hud-element {
            position: absolute;
            right: 100px;
            top: 50%;
            transform: translateY(-50%);
            width: 400px;
            height: 400px;
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hud-inner {
            width: 300px;
            height: 300px;
            border: 2px dashed rgba(112, 0, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: rotate 20s linear infinite;
        }
        .hud-center {
            width: 150px;
            height: 150px;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid #00f0ff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #00f0ff;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.2);
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="slide-container">
        <div class="grid-overlay"></div>
        <div class="content">
            <div class="kicker">Live Environment // Alpha</div>
            <h1>IA Academy:<br>Mentoria de IA</h1>
            <p class="subtitle">Arquitetura e Inovação Educacional para a Próxima Geração de Engenheiros.</p>
            <div class="footer">
                <span><i class="fas fa-microchip"></i> Backend: Node/tRPC</span>
                <span><i class="fas fa-layer-group"></i> Frontend: React 19</span>
                <span><i class="fas fa-database"></i> DB: Drizzle/MySQL</span>
            </div>
        </div>
        <div class="hud-element">
            <div class="hud-inner"></div>
            <div class="hud-center">
                <i class="fas fa-brain"></i>
            </div>
        </div>
    </div>
</body>
</html>
